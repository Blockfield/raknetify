name: Build
on:
  push:
    branches: [master]
    tags: ["bf[0-9]*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Apply Blockfield patches
        run: |
          set -euo pipefail
          git apply --check patches/*.patch
          git apply --stat patches/*.patch
          git apply patches/*.patch
          # Commit the applied tree so the build version is clean and
          # deterministic (upstream derives it from `git describe`).
          git -c user.name=ci -c user.email=ci@localhost commit -qam "Apply patches for CI build"
      # Builds only the shipped modules: bungee is skipped (its BungeeCord
      # snapshot host is dead and we do not ship a bungee jar).
      - name: Build
        run: ./gradlew :common:build :fabric:build :velocity:build
      - name: Bytecode check (patched channelRead releases FrameData)
        run: |
          set -euo pipefail
          jar=$(ls common/build/libs/raknetify-common-*.jar | grep -v -e sources -e javadoc | head -1)
          tmp=$(mktemp -d)
          unzip -q "$jar" 'com/ishland/raknetify/common/connection/SynchronizationLayer.class' -d "$tmp"
          javap -c -p "$tmp/com/ishland/raknetify/common/connection/SynchronizationLayer.class" > "$tmp/sync.txt"
          grep -q 'FrameData.release' "$tmp/sync.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ./**/build/libs/*-all.jar
          retention-days: 7
      - name: Release patched jars under the tag
        if: startsWith(github.ref, 'refs/tags/bf')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for mod in fabric velocity; do
            src=$(ls $mod/build/libs/raknetify-$mod-*-all.jar | head -1)
            out="dist/$(basename "$src" -all.jar)-$GITHUB_REF_NAME-all.jar"
            cp "$src" "$out"
          done
          (cd dist && sha512sum *.jar > SHA512SUMS && sha256sum *.jar > SHA256SUMS)
          {
            echo "Patched raknetify $GITHUB_REF_NAME."
            echo "Upstream source: RelativityMC/raknetify@76ab30a11a786daafb94c4ef95de457158cf80ce"
            echo "plus patches/*.patch applied at build time (see repo)."
            echo "Bytecode check: SynchronizationLayer.channelRead calls FrameData.release."
            echo ""
            cat dist/SHA512SUMS
          } > dist/release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA512SUMS dist/SHA256SUMS \
            --title "raknetify $GITHUB_REF_NAME (patched)" --notes-file dist/release-notes.md
